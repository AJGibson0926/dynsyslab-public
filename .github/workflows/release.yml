name: Native Windows release

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check the native UI capability ledger
        run: python -m unittest tester.tests.test_native_ui_parity_contract -v
      - name: Locate vcpkg
        shell: pwsh
        run: |
          $root = $env:VCPKG_INSTALLATION_ROOT
          if (-not $root) { $root = Split-Path -Parent (Get-Command vcpkg -ErrorAction Stop).Source }
          "VCPKG_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Configure and build
        run: |
          cmake --preset windows-fast-release
          if ($LASTEXITCODE -ne 0) { throw 'Configuration failed' }
          cmake --build --preset windows-fast-release-gates --parallel
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
      - name: Native regression and isolated package gates
        run: |
          ctest --preset windows-fast-release
          if ($LASTEXITCODE -ne 0) { throw 'Native tests failed' }
          cmake --build build/native-suite-fast --target dynsyslab_package_smoke
          if ($LASTEXITCODE -ne 0) { throw 'Package gates failed' }
      - name: Package and checksum
        shell: pwsh
        run: |
          cmake --build build/native-suite-fast --target package
          if ($LASTEXITCODE -ne 0) { throw 'Packaging failed' }
          $zip = @(Get-ChildItem build/native-suite-fast/DynSysLab-*-windows-x64.zip)
          if ($zip.Count -ne 1) { throw 'Expected one release ZIP' }
          $line = (Get-FileHash -LiteralPath $zip[0].FullName -Algorithm SHA256).Hash.ToLower() + '  ' + $zip[0].Name
          [IO.File]::WriteAllText('build/native-suite-fast/SHA256SUMS.txt', $line + "`n", [Text.UTF8Encoding]::new($false))
          ./tools/Test-ReleaseInstall.ps1 -PackagePath $zip[0].FullName -ChecksumPath build/native-suite-fast/SHA256SUMS.txt
      - name: Build the Python client wheel
        run: |
          python -m pip wheel . --no-deps -w build/native-suite-fast/wheel
          if ($LASTEXITCODE -ne 0) { throw 'Wheel build failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: DynSysLab-windows-x64
          path: |
            build/native-suite-fast/DynSysLab-*-windows-x64.zip
            build/native-suite-fast/SHA256SUMS.txt
            build/native-suite-fast/wheel/*.whl
            install.ps1
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Every release body starts with the install-and-run procedure.
          $notes = (Get-Content -Raw .github/release-notes-template.md).Replace('{{TAG}}', $env:GITHUB_REF_NAME)
          [IO.File]::WriteAllText("$PWD/build/release-notes.md", $notes, [Text.UTF8Encoding]::new($false))
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:GITHUB_REF_NAME --draft --verify-tag --generate-notes --notes-file build/release-notes.md --title "DynSysLab $env:GITHUB_REF_NAME"
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
          }
          $body = gh release view $env:GITHUB_REF_NAME --json body -q .body | Out-String
          if (-not $body.TrimStart().StartsWith('### Install and run')) {
            [IO.File]::WriteAllText("$PWD/build/release-notes.md", $notes + "`n" + $body, [Text.UTF8Encoding]::new($false))
            gh release edit $env:GITHUB_REF_NAME --notes-file build/release-notes.md
            if ($LASTEXITCODE -ne 0) { throw 'Release notes update failed' }
          }
          $zip = @(Get-ChildItem build/native-suite-fast/DynSysLab-*-windows-x64.zip)
          if ($zip.Count -ne 1) { throw 'Expected one release ZIP' }
          $wheel = @(Get-ChildItem build/native-suite-fast/wheel/*.whl | ForEach-Object FullName)
          gh release upload $env:GITHUB_REF_NAME $zip[0].FullName build/native-suite-fast/SHA256SUMS.txt install.ps1 @wheel --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
          gh release edit $env:GITHUB_REF_NAME --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
