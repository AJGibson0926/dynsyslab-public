name: optional Python native bindings

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "native/**"
      - ".github/workflows/native-wheels.yml"

jobs:
  build:
    name: ${{ matrix.os }} wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install wheel builder
        run: python -m pip install cibuildwheel
      - name: Build and smoke-test native wheels
        run: python -m cibuildwheel native --output-dir wheelhouse
      - uses: actions/upload-artifact@v4
        with:
          name: dynsyslab-native-${{ matrix.os }}
          path: wheelhouse/*.whl
