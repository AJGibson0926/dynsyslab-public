<div id="__ROOT_ID__">
  <h2>Time and phase choices on the solenoid</h2>
  <div class="viz-controls">
    <label class="form-label">Prime p <select class="form-select" data-control="prime"><option>2</option><option>3</option></select></label>
    <label class="form-label">Initial base phase <span data-value="phase" class="tabular-nums"></span><input class="form-range" data-control="phase" type="range" min="0" max="359" value="60"></label>
    <label class="form-label">Initial branch digit 1 <select class="form-select" data-control="digit1"></select></label>
    <label class="form-label">Initial branch digit 2 <select class="form-select" data-control="digit2"></select></label>
  </div>
  <div class="viz-controls">
    <label class="form-label">Elapsed time <span data-value="time" class="tabular-nums"></span><input class="form-range" data-control="time" type="range" min="0" max="480" value="0" step="1"></label>
    <button class="btn" type="button" data-control="advance">Advance one base period</button>
  </div>
  <h3>Finite suspension chart · rows are phase choices</h3>
  <canvas class="cover-suspension" role="img" aria-label="A finite suspension chart: time advances horizontally, and endpoint gluing increments the phase address"></canvas>
  <div data-value="selection" aria-live="polite" class="tabular-nums"></div>
  <div class="cover-panels"></div>
  <div class="viz-row text-small"><span>Color: mapped base phase</span><canvas class="cover-legend" role="img" aria-label="Phase color cycles from red through green and blue, returning to red"></canvas><span>Filled point: selected branch · ring: compatible next choice</span></div>
  <div class="text-small">Three finite levels · curve: fixed physical orbit · circle: uniform-time phase · higher address digits unspecified</div>
</div>
<style>
  #__ROOT_ID__ {display:grid;gap:calc(var(--font-size-base)*.8)}
  #__ROOT_ID__ .cover-panels {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:calc(var(--font-size-base)*.8)}
  #__ROOT_ID__ .cover-panel {min-width:0;display:grid;gap:calc(var(--font-size-base)*.25)}
  #__ROOT_ID__ .cover-canvas {width:100%;height:510px;touch-action:none}
  #__ROOT_ID__ .cover-legend {width:160px;height:24px}
  #__ROOT_ID__ .cover-suspension {width:100%;height:240px}
  @media(max-width:740px){#__ROOT_ID__ .cover-panels{grid-template-columns:1fr}}
</style>
<script>
(()=>{
__CLOCK_HELPER__
const root=document.getElementById('__ROOT_ID__'),data=__GEOMETRY__,display=__PRESENTATION__;
const input=name=>root.querySelector(`[data-control="${name}"]`),value=name=>root.querySelector(`[data-value="${name}"]`);
const saved=window.openai?.widgetState?.modelContent||{};
let p=data[saved.prime]?Number(saved.prime):Number(Object.keys(data)[0]),degrees=60,a=0,b=0,timeTicks=0;
let panels=[],views=Array.from({length:3},()=>({xmin:display.bounds[0],xmax:display.bounds[1],ymin:display.bounds[2],ymax:display.bounds[3]}));
input('prime').innerHTML=Object.keys(data).map(k=>`<option>${k}</option>`).join('');
function color(name){const el=document.createElement('span');el.style.color=`var(--${name})`;root.appendChild(el);const result=getComputedStyle(el).color;el.remove();return result;}
function rgb(s){const c=document.createElement('canvas').getContext('2d');c.fillStyle=s;c.fillRect(0,0,1,1);return Array.from(c.getImageData(0,0,1,1).data).slice(0,3);}
let palette,fg,bg,grid,active;
function theme(){palette=['red','green','blue'].map(n=>rgb(color(n)));fg=color('foreground');bg=color('background');grid=color('border');active=color('viz-series-1');}
function phaseColor(turn){const z=((turn%1)+1)%1*3,i=Math.floor(z),t=z-i,c=palette[i].map((v,j)=>Math.round(v*(1-t)+palette[(i+1)%3][j]*t));return `rgb(${c.join(',')})`;}
function clock(){return phaseCoverDisplayClock(p,[a,b],degrees,timeTicks);}
function save(){window.openai?.setWidgetState?.({modelContent:{prime:p,phaseDegrees:degrees,digits:[a,b],elapsedTicks:timeTicks,currentDigits:clock().digits},privateContent:null}).catch(()=>{});}
function choices(){for(const name of ['digit1','digit2'])input(name).innerHTML=Array.from({length:p},(_,j)=>`<option>${j}</option>`).join('');input('digit1').value=a;input('digit2').value=b;input('prime').value=p;input('phase').value=degrees;input('time').value=timeTicks;}
function point(orbit,turn){const v=orbit.values,n=data[p].samples,u=((turn%1)+1)%1*n,i=Math.floor(u),j=(i+1)%n,t=u-i;return [v[2*i]*(1-t)+v[2*j]*t,v[2*i+1]*(1-t)+v[2*j+1]*t];}
function setup(){root.querySelector('.cover-panels').innerHTML='';panels=[];for(let j=0;j<3;j++){
 const el=document.createElement('div');el.className='cover-panel';const title=document.createElement('h3');el.appendChild(title);
 const canvas=document.createElement('canvas');canvas.className='cover-canvas';canvas.setAttribute('role','img');canvas.setAttribute('aria-label',`Orbit level ${j} with compatible phase choices`);el.appendChild(canvas);
 root.querySelector('.cover-panels').appendChild(el);const panel={el,title,canvas,j,hits:[]};panels.push(panel);let drag=null;
 canvas.addEventListener('wheel',e=>{if(e.offsetY>320)return;e.preventDefault();const v=views[j],rect=canvas.getBoundingClientRect(),w=rect.width,L=44,R=w-12,T=18,B=285,tx=(e.offsetX-L)/(R-L),ty=(B-e.offsetY)/(B-T),x=v.xmin+tx*(v.xmax-v.xmin),y=v.ymin+ty*(v.ymax-v.ymin),s=Math.exp(Math.sign(e.deltaY)*.16);views[j]={xmin:x+(v.xmin-x)*s,xmax:x+(v.xmax-x)*s,ymin:y+(v.ymin-y)*s,ymax:y+(v.ymax-y)*s};draw();},{passive:false});
 canvas.addEventListener('pointerdown',e=>{drag={x:e.offsetX,y:e.offsetY,old:{...views[j]},moved:false};canvas.setPointerCapture(e.pointerId)});
 canvas.addEventListener('pointermove',e=>{if(!drag||drag.y>320)return;const dx=e.offsetX-drag.x,dy=e.offsetY-drag.y;if(Math.hypot(dx,dy)>4)drag.moved=true;const w=canvas.getBoundingClientRect().width,v=drag.old;views[j]={xmin:v.xmin-dx*(v.xmax-v.xmin)/(w-56),xmax:v.xmax-dx*(v.xmax-v.xmin)/(w-56),ymin:v.ymin+dy*(v.ymax-v.ymin)/267,ymax:v.ymax+dy*(v.ymax-v.ymin)/267};draw()});
 canvas.addEventListener('pointerup',e=>{if(drag&&!drag.moved){const hit=panel.hits.find(h=>Math.hypot(h.x-e.offsetX,h.y-e.offsetY)<13);if(hit&&j){const state=clock();const chosen=j===2?hit.k:hit.k+p*state.digits[1];const initial=((chosen-state.turns)%(p*p)+p*p)%(p*p);a=initial%p;b=Math.floor(initial/p);choices();draw();save();}}drag=null});
 canvas.addEventListener('pointercancel',()=>drag=null);
}}
function draw(){const state=clock(),currentA=state.digits[0],base=state.base;value('phase').textContent=`${degrees}°`;
 value('time').textContent=`${(timeTicks/40).toFixed(3)} T₀`;input('advance').disabled=timeTicks>440;
 value('selection').textContent=`Current base phase ${(360*base).toFixed(1)}° · address mod ${p*p}: ${state.residue} · ${state.turns} base returns · higher-digit carry ${state.prefixCarry}`;
 root.dataset.clock=JSON.stringify(state);
 drawSuspension(state);
 for(const panel of panels){const {canvas,j}=panel,orbit=data[p].orbits[j],count=p**j,kselected=j===0?0:j===1?currentA:state.residue,v=views[j],w=canvas.getBoundingClientRect().width,h=510,dpr=window.devicePixelRatio||1;
 canvas.width=Math.round(w*dpr);canvas.height=h*dpr;const c=canvas.getContext('2d');c.scale(dpr,dpr);c.clearRect(0,0,w,h);c.font=getComputedStyle(root).font;panel.hits=[];
 panel.title.textContent=`Orbit ${j}: ω₀${j?'/'+count:''} · ${count} ${count===1?'point':'points'}`;
 canvas.setAttribute('aria-label',`Orbit level ${j}, phase ${(360*state.phases[j]).toFixed(2)} degrees, selected residue ${kselected} of ${count}`);
 const L=44,R=w-12,T=18,B=285,X=x=>L+(x-v.xmin)/(v.xmax-v.xmin)*(R-L),Y=y=>B-(y-v.ymin)/(v.ymax-v.ymin)*(B-T);
 c.strokeStyle=grid;c.lineWidth=1;c.fillStyle=fg;c.textAlign='center';
 for(let n=0;n<=4;n++){const x=v.xmin+(v.xmax-v.xmin)*n/4,y=v.ymin+(v.ymax-v.ymin)*n/4;c.beginPath();c.moveTo(X(x),T);c.lineTo(X(x),B);c.moveTo(L,Y(y));c.lineTo(R,Y(y));c.stroke();c.fillText(x.toFixed(1),X(x),B+19);c.textAlign='right';c.fillText(y.toFixed(1),L-6,Y(y)+4);c.textAlign='center';}
 c.fillText(display.axisLabels[0],(L+R)/2,B+39);c.save();c.translate(12,(T+B)/2);c.rotate(-Math.PI/2);c.fillText(display.axisLabels[1],0,0);c.restore();
 c.save();c.beginPath();c.rect(L,T,R-L,B-T);c.clip();const n=data[p].samples;
 for(let i=0;i<n;i++){const q=point(orbit,i/n),r=point(orbit,(i+1)/n);c.strokeStyle=phaseColor(count*(i+.5)/n);c.lineWidth=2.2;c.beginPath();c.moveTo(X(q[0]),Y(q[1]));c.lineTo(X(r[0]),Y(r[1]));c.stroke();}
 for(let k=0;k<count;k++){const turn=(base+k)/count,q=point(orbit,turn),eligible=j<2||k%p===currentA;mark(X(q[0]),Y(q[1]),k,eligible,k===kselected,true);}
 c.restore();const cx=w/2,cy=430,rad=52;c.strokeStyle=grid;c.lineWidth=1;c.beginPath();c.arc(cx,cy,rad,0,2*Math.PI);c.stroke();c.fillStyle=fg;c.textAlign='center';c.fillText('Uniform-time phase φ'+j,cx,cy-rad-38);
 for(let k=0;k<count;k++){const t=(base+k)/count,angle=2*Math.PI*t,x=cx+rad*Math.cos(angle),y=cy-rad*Math.sin(angle),eligible=j<2||k%p===currentA;mark(x,y,k,eligible,k===kselected,false);c.fillStyle=fg;c.fillText(String(k),cx+(rad+18)*Math.cos(angle),cy-(rad+18)*Math.sin(angle)+4);}
 function mark(x,y,k,eligible,selected,physical){c.globalAlpha=eligible?1:.6;c.fillStyle=selected?fg:bg;c.strokeStyle=eligible?active:fg;c.lineWidth=selected?2.5:1.7;c.beginPath();c.arc(x,y,selected?6:4.5,0,2*Math.PI);c.fill();c.stroke();c.globalAlpha=1;if(!physical||x>=L&&x<=R&&y>=T&&y<=B)panel.hits.push({x,y,k});}
 }
 const legend=root.querySelector('.cover-legend'),c=legend.getContext('2d');legend.width=160;legend.height=24;for(let x=0;x<160;x++){c.fillStyle=phaseColor(x/160);c.fillRect(x,0,1,10);}c.fillStyle=fg;c.font=getComputedStyle(root).font;c.fillText('0',0,24);c.textAlign='right';c.fillText('2π',160,24);
}
function drawSuspension(state){const canvas=root.querySelector('.cover-suspension'),w=canvas.getBoundingClientRect().width,n=p*p,h=52+26*n,dpr=window.devicePixelRatio||1;
 canvas.style.height=h+'px';canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);const c=canvas.getContext('2d');c.scale(dpr,dpr);c.font=getComputedStyle(root).font;
 const L=70,R=w-76;const order=Array.from({length:n},(_,i)=>Math.floor(i/p)+(i%p)*p);
 c.fillStyle=fg;c.textAlign='center';c.fillText('Base phase (turns)',(L+R)/2,15);
 for(let i=0;i<n;i++){const k=order[i],y=38+26*i;c.strokeStyle=grid;c.lineWidth=1;c.beginPath();c.moveTo(L,y);c.lineTo(R,y);c.stroke();c.fillStyle=fg;c.textAlign='right';c.fillText(String(k),L-12,y+4);c.textAlign='left';c.fillText('→ '+((k+1)%n),R+10,y+4);
 if(k===state.residue){c.fillStyle=active;c.beginPath();c.arc(L+(R-L)*state.base,y,6,0,2*Math.PI);c.fill();}}
 c.fillStyle=fg;c.textAlign='center';c.fillText('0',L,h-4);c.fillText('1',R,h-4);
}
input('prime').addEventListener('change',()=>{p=Number(input('prime').value);a=b=0;choices();draw();save()});
input('phase').addEventListener('input',()=>{degrees=Number(input('phase').value);draw()});input('phase').addEventListener('change',save);
input('time').addEventListener('input',()=>{timeTicks=Number(input('time').value);draw()});input('time').addEventListener('change',save);
input('advance').addEventListener('click',()=>{timeTicks=Math.min(480,timeTicks+40);choices();draw();save()});
for(const name of ['digit1','digit2'])input(name).addEventListener('change',()=>{a=Number(input('digit1').value);b=Number(input('digit2').value);draw();save()});
function restore(s){if(!s||!data[s.prime])return;p=Number(s.prime);degrees=Math.max(0,Math.min(359,Math.round(Number(s.phaseDegrees)||0)));timeTicks=Math.max(0,Math.min(480,Math.round(Number(s.elapsedTicks)||0)));a=Math.min(p-1,Math.max(0,Math.round(Number(s.digits?.[0])||0)));b=Math.min(p-1,Math.max(0,Math.round(Number(s.digits?.[1])||0)));}
restore(saved);
theme();choices();setup();new ResizeObserver(draw).observe(root.querySelector('.cover-panels'));new MutationObserver(()=>{theme();draw()}).observe(document.documentElement,{attributes:true,attributeFilter:['class','style','data-theme']});draw();
window.addEventListener('openai:set_globals',e=>{const s=e.detail?.globals?.widgetState?.modelContent;if(!s||!data[s.prime])return;restore(s);choices();draw()});
})();
</script>
