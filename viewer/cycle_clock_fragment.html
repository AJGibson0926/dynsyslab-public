<div id="__ROOT_ID__">
  <style>
    #__ROOT_ID__ {color:var(--foreground);display:grid;gap:calc(var(--font-size-base)*1)}
    #__ROOT_ID__ .clock-panels {display:grid;grid-template-columns:repeat(auto-fit,minmax(min(210px,100%),1fr));gap:calc(var(--font-size-base)*1)}
    #__ROOT_ID__ .clock-panel {min-width:0}
    #__ROOT_ID__ .clock-svg {display:block;width:100%;overflow:visible}
    #__ROOT_ID__ .clock-svg text {fill:var(--foreground)}
    #__ROOT_ID__ .clock-ring {fill:none;stroke:var(--border);stroke-width:1.5}
    #__ROOT_ID__ .clock-tick {fill:var(--muted-foreground)}
    #__ROOT_ID__ .clock-hand {stroke:var(--viz-series-1);stroke-width:2;fill:none}
    #__ROOT_ID__ .clock-marker {fill:var(--viz-series-1)}
    #__ROOT_ID__ .clock-status {overflow-wrap:anywhere}
  </style>
  <h3>One step advances every quotient</h3>
  <div class="viz-controls">
    <button type="button" class="btn btn-primary" data-step></button>
    <span class="clock-status tabular-nums" data-status aria-live="polite"></span>
  </div>
  <div class="clock-panels" data-clocks></div>
  <div class="text-small">Finite quotient clocks · further levels continue beyond this view</div>
  <script>
  (() => {
    const root = document.getElementById('__ROOT_ID__');
    const config = __CONFIG__;
    const panel = root.querySelector('[data-clocks]');
    const status = root.querySelector('[data-status]');
    const button = root.querySelector('[data-step]');
    const namespace = 'http://www.w3.org/2000/svg';
    const mod = (a,n) => Number(((a % BigInt(n)) + BigInt(n)) % BigInt(n));
    let count = BigInt(config.initialStep), frame = 0;
    button.textContent = config.stepLabel;
    const savedCount = state => {
      const s = state?.modelContent;
      return s?.schema === 'dynsyslab.cycle-clock/v1' &&
        JSON.stringify(s.periods) === JSON.stringify(config.periods) &&
        typeof s.step === 'string' && /^-?\d{1,100}$/.test(s.step) ? BigInt(s.step) : null;
    };
    const prior = savedCount(window.openai?.widgetState);
    if (prior !== null) count = prior;
    function element(tag, attributes, text) {
      const node = document.createElementNS(namespace,tag);
      for (const [key,value] of Object.entries(attributes)) node.setAttribute(key,String(value));
      if (text !== undefined) node.textContent = text;
      return node;
    }
    const clocks = config.periods.map(n => {
      const div = document.createElement('div'); div.className = 'clock-panel';
      const svg = element('svg',{class:'clock-svg',role:'img'});
      div.appendChild(svg); panel.appendChild(div);
      return {n,div,svg};
    });
    function draw(previous = count, progress = 1) {
      status.textContent = 'Step ' + count.toString();
      for (const c of clocks) {
        const w = Math.max(200,c.div.clientWidth), h = 230;
        c.svg.setAttribute('viewBox',`0 0 ${w} ${h}`); c.svg.setAttribute('height',h);
        const residue = mod(count,c.n), cx = w/2, cy = 117, radius = 68;
        c.svg.setAttribute('data-residue',residue);
        c.svg.setAttribute('aria-label',`Modulo ${c.n} clock. Current residue ${residue}.`);
        c.svg.replaceChildren();
        c.svg.appendChild(element('text',{x:cx,y:18,'text-anchor':'middle'},`Modulo ${c.n}`));
        c.svg.appendChild(element('circle',{cx,cy,r:radius,class:'clock-ring'}));
        for (let j=0;j<c.n;j++) {
          const angle = 2*Math.PI*j/c.n-Math.PI/2;
          const x = cx+radius*Math.cos(angle), y = cy+radius*Math.sin(angle);
          c.svg.appendChild(element('circle',{cx:x,cy:y,r:2.5,class:'clock-tick'}));
          if (c.n<=8 || j%Math.ceil(c.n/8)===0) {
            c.svg.appendChild(element('text',{x:cx+(radius+18)*Math.cos(angle),
              y:cy+(radius+18)*Math.sin(angle)+4,'text-anchor':'middle',class:'text-small'},j));
          }
        }
        const turn = progress<1 ? (mod(previous,c.n)+progress)/c.n : residue/c.n;
        const a = 2*Math.PI*turn-Math.PI/2;
        const x = cx+radius*Math.cos(a), y = cy+radius*Math.sin(a);
        c.svg.appendChild(element('line',{x1:cx,y1:cy,x2:x,y2:y,class:'clock-hand'}));
        c.svg.appendChild(element('circle',{cx:x,cy:y,r:6,class:'clock-marker'}));
        c.svg.appendChild(element('text',{x:cx,y:222,'text-anchor':'middle'},`Residue ${residue} of ${c.n}`));
      }
    }
    button.addEventListener('click',() => {
      cancelAnimationFrame(frame);
      const previous = count; count += 1n;
      if (matchMedia('(prefers-reduced-motion: reduce)').matches) draw();
      else {
        const begin = performance.now();
        const animate = now => {
          const fraction = Math.min(1,(now-begin)/230);
          draw(previous,fraction);
          if (fraction<1) frame=requestAnimationFrame(animate);
        };
        frame=requestAnimationFrame(animate);
      }
      const snapshot = {modelContent:{schema:'dynsyslab.cycle-clock/v1',
        step:count.toString(),periods:config.periods},privateContent:null};
      window.openai?.setWidgetState?.(snapshot)?.catch(() => {});
    });
    window.addEventListener('openai:set_globals',event => {
      const restored = savedCount(event.detail?.globals?.widgetState);
      if (restored !== null) {cancelAnimationFrame(frame);count=restored;draw();}
    });
    new ResizeObserver(() => draw()).observe(panel);
    draw();
  })();
  </script>
</div>
