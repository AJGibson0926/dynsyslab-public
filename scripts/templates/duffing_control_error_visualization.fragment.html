<div id="duffing-control-error-root">
  <h2>Optimized-eigenvalue / SINDy Duffing control-map error</h2>
  <div class="viz-controls">
    <label class="form-label" for="duffing-error-measure">Error measure
      <select class="form-select" id="duffing-error-measure">
        <option value="relative" selected>Relative Frobenius error</option>
        <option value="absolute">Absolute Frobenius error</option>
      </select>
    </label>
  </div>
  <div class="plots" aria-live="polite"></div>
  <div class="tooltip" role="tooltip" hidden></div>
</div>
<style>
#duffing-control-error-root { position: relative; width: 100%; color: var(--foreground); }
#duffing-control-error-root .plots { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 18px; align-items: start; }
#duffing-control-error-root .plot-panel { min-width: 0; }
#duffing-control-error-root .plot-panel h3 { text-align: center; margin-bottom: 4px; }
#duffing-control-error-root .plot-panel svg { display: block; width: 100%; height: auto; }
#duffing-control-error-root .frame { fill: none; stroke: var(--border); stroke-width: 1; }
#duffing-control-error-root .grid line { stroke: var(--border); stroke-opacity: .35; }
#duffing-control-error-root .axis text, #duffing-control-error-root .axis-title { fill: var(--foreground); font-size: 12px; }
#duffing-control-error-root .axis path, #duffing-control-error-root .axis line { stroke: var(--border); }
#duffing-control-error-root .cell { fill: var(--viz-series-1); }
#duffing-control-error-root .tooltip { position: absolute; pointer-events: none; background: var(--popover); color: var(--popover-foreground); border: 1px solid var(--border); padding: 6px 8px; z-index: 5; }
#duffing-control-error-root .legend { display: flex; align-items: center; justify-content: center; gap: 5px; color: var(--muted-foreground); }
#duffing-control-error-root .legend-bar { width: 110px; height: 10px; background: linear-gradient(90deg,color-mix(in srgb,var(--viz-series-1) 10%,transparent),var(--viz-series-1)); }
@media (max-width: 700px) { #duffing-control-error-root .plots { grid-template-columns: 1fr; } }
</style>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script>
(() => {
  const root=document.getElementById("duffing-control-error-root");
  const data=__DATA_JSON__;
  const plots=root.querySelector(".plots");
  const selector=root.querySelector("#duffing-error-measure");
  const tooltip=root.querySelector(".tooltip");
  data.panels.forEach(panel => {
    const section=document.createElement("section"); section.className="plot-panel";
    const title=document.createElement("h3"); title.textContent=panel.label; section.appendChild(title);
    const chart=document.createElement("div"); chart.className="chart"; section.appendChild(chart);
    const legend=document.createElement("div"); legend.className="legend text-small";
    legend.innerHTML='<span>lower</span><span class="legend-bar" aria-hidden="true"></span><span>higher</span>'; section.appendChild(legend);
    plots.appendChild(section); panel.container=chart;
  });
  function drawPanel(panel,measure) {
    const container=panel.container; container.replaceChildren();
    const width=Math.max(300,container.getBoundingClientRect().width||300), height=Math.min(470,width+80);
    const margin={top:12,right:16,bottom:58,left:68}, innerW=width-margin.left-margin.right, innerH=height-margin.top-margin.bottom;
    const svg=d3.select(container).append("svg").attr("viewBox",`0 0 ${width} ${height}`).attr("role","img")
      .attr("aria-label",`${panel.label}, log base ten ${measure} Frobenius matrix error over Duffing phase space`);
    svg.append("title").text(`${panel.label}: log10 ${measure} Frobenius error`);
    const g=svg.append("g").attr("transform",`translate(${margin.left},${margin.top})`);
    const x=d3.scaleLinear().domain(d3.extent(data.x)).range([0,innerW]);
    const y=d3.scaleLinear().domain(d3.extent(data.y)).range([innerH,0]);
    const values=panel[measure], flat=values.flat(); const extent=d3.extent(flat);
    const opacity=d3.scaleLinear().domain(extent[0]===extent[1]?[extent[0]-1,extent[1]+1]:extent).range([.10,1]);
    const dx=innerW/Math.max(1,data.x.length-1), dy=innerH/Math.max(1,data.y.length-1);
    const cells=[]; data.y.forEach((yv,iy)=>data.x.forEach((xv,ix)=>cells.push({x:xv,y:yv,value:values[iy][ix],ix,iy})));
    g.append("g").attr("class","grid").call(d3.axisLeft(y).ticks(width<400?4:6).tickSize(-innerW).tickFormat(""));
    g.selectAll("rect.cell").data(cells).join("rect").attr("class","cell")
      .attr("x",d=>Math.max(0,x(d.x)-dx/2)).attr("y",d=>Math.max(0,y(d.y)-dy/2))
      .attr("width",dx+1).attr("height",dy+1).attr("fill-opacity",d=>opacity(d.value));
    g.append("rect").attr("class","frame").attr("data-chart-frame","").attr("width",innerW).attr("height",innerH);
    g.append("g").attr("class","axis").attr("transform",`translate(0,${innerH})`).call(d3.axisBottom(x).ticks(width<400?4:6));
    g.append("g").attr("class","axis").call(d3.axisLeft(y).ticks(width<400?4:6));
    svg.append("text").attr("class","axis-title").attr("data-axis","x").attr("x",margin.left+innerW/2).attr("y",height-10).attr("text-anchor","middle").text("Duffing position x (dimensionless)");
    svg.append("text").attr("class","axis-title").attr("data-axis","y").attr("transform",`translate(16 ${margin.top+innerH/2}) rotate(-90)`).attr("text-anchor","middle").text("Velocity xdot (dimensionless)");
    g.append("rect").attr("data-chart-hit","").attr("data-chart-hover-overlay","cross-series").attr("width",innerW).attr("height",innerH).attr("fill","transparent")
      .on("pointermove",event => { const [px,py]=d3.pointer(event); const xv=x.invert(px),yv=y.invert(py);
        const ix=d3.bisector(d=>d).center(data.x,xv), iy=d3.bisector(d=>d).center(data.y,yv); const value=values[iy][ix];
        tooltip.hidden=false; tooltip.textContent=`x ${data.x[ix].toPrecision(4)}, xdot ${data.y[iy].toPrecision(4)}: log10 error ${value.toFixed(4)}`;
        const rect=root.getBoundingClientRect(); tooltip.style.left=`${event.clientX-rect.left+10}px`; tooltip.style.top=`${event.clientY-rect.top+10}px`; })
      .on("pointerleave",()=>{tooltip.hidden=true;});
  }
  function draw(){ data.panels.forEach(panel=>drawPanel(panel,selector.value)); }
  selector.addEventListener("change",draw); new ResizeObserver(draw).observe(plots); draw();
})();
</script>
