<div id="duffing-klqr-representation-root">
  <h2>Duffing KLQR with approximate control maps</h2>
  <div class="comparison" aria-live="polite"></div>
  <div class="tooltip" role="tooltip" hidden></div>
</div>
<style>
#duffing-klqr-representation-root { position: relative; width: 100%; color: var(--foreground); }
#duffing-klqr-representation-root .case-row { margin-bottom: 20px; }
#duffing-klqr-representation-root .case-row h3 { margin-bottom: 6px; }
#duffing-klqr-representation-root .failure { margin: 0 0 10px; }
#duffing-klqr-representation-root .plots { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 14px; align-items: start; }
#duffing-klqr-representation-root .panel { min-width: 0; }
#duffing-klqr-representation-root .panel h4 { text-align: center; margin: 0 0 3px; font-weight: 500; }
#duffing-klqr-representation-root svg { display: block; width: 100%; height: auto; }
#duffing-klqr-representation-root .frame { fill: none; stroke: var(--border); stroke-width: 1; }
#duffing-klqr-representation-root .grid line { stroke: var(--border); stroke-opacity: .28; }
#duffing-klqr-representation-root .grid path { display: none; }
#duffing-klqr-representation-root .axis text, #duffing-klqr-representation-root .axis-title { fill: var(--foreground); font-size: 12px; }
#duffing-klqr-representation-root .axis path, #duffing-klqr-representation-root .axis line { stroke: var(--border); }
#duffing-klqr-representation-root .actual { fill: none; stroke-width: 1.8; }
#duffing-klqr-representation-root .target { fill: none; stroke: var(--red); stroke-width: 1.6; stroke-dasharray: 5 4; }
#duffing-klqr-representation-root .target-point { fill: var(--red); }
#duffing-klqr-representation-root .window { fill: var(--muted); opacity: .18; }
#duffing-klqr-representation-root .tooltip { position: absolute; pointer-events: none; background: var(--popover); color: var(--popover-foreground); border: 1px solid var(--border); padding: 6px 8px; z-index: 5; }
@media (max-width: 800px) { #duffing-klqr-representation-root .plots { grid-template-columns: repeat(2,minmax(0,1fr)); } }
@media (max-width: 480px) { #duffing-klqr-representation-root .plots { grid-template-columns: 1fr; } }
</style>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script>
(() => {
  const root=document.getElementById("duffing-klqr-representation-root");
  const data=__DATA_JSON__;
  const comparison=root.querySelector(".comparison");
  const tooltip=root.querySelector(".tooltip");
  const seriesTokens=["--viz-series-1","--viz-series-2","--viz-series-3"];
  function padded(values) {
    const extent=d3.extent(values); const span=extent[1]-extent[0];
    const pad=span>0?span*.06:Math.max(Math.abs(extent[0]),1)*.08;
    return [extent[0]-pad,extent[1]+pad];
  }
  function makePanel(row,title) {
    const panel=document.createElement("section"); panel.className="panel";
    const heading=document.createElement("h4"); heading.textContent=title; panel.appendChild(heading);
    const chart=document.createElement("div"); panel.appendChild(chart); row.appendChild(panel); return chart;
  }
  data.cases.forEach((record,index) => {
    const section=document.createElement("section"); section.className="case-row";
    const heading=document.createElement("h3"); heading.textContent=record.label; section.appendChild(heading);
    if(record.status!=="complete") {
      const failure=document.createElement("p"); failure.className="failure text-destructive";
      failure.setAttribute("role","alert"); failure.textContent=`Solve failed: ${record.message}`;
      section.appendChild(failure); comparison.appendChild(section); return;
    }
    const row=document.createElement("div"); row.className="plots"; section.appendChild(row); comparison.appendChild(section);
    record.color=seriesTokens[index%seriesTokens.length];
    record.charts={phase:makePanel(row,"Phase portrait"),x:makePanel(row,"Position"),v:makePanel(row,"Velocity"),u:makePanel(row,"Control input")};
  });
  function draw(record,kind) {
    const container=record.charts[kind]; container.replaceChildren();
    const width=Math.max(260,container.getBoundingClientRect().width||260), height=kind==="phase"?width:Math.max(230,width*.76);
    const margin={top:10,right:12,bottom:52,left:64}, innerW=width-margin.left-margin.right, innerH=height-margin.top-margin.bottom;
    const svg=d3.select(container).append("svg").attr("viewBox",`0 0 ${width} ${height}`).attr("role","img");
    const descriptions={phase:"Duffing phase portrait",x:"Duffing position and target versus dimensionless time",v:"Duffing velocity and target versus dimensionless time",u:"Dimensionless KLQR control input versus time"};
    svg.attr("aria-label",`${record.label}: ${descriptions[kind]}`); svg.append("title").text(`${record.label}: ${descriptions[kind]}`);
    const g=svg.append("g").attr("transform",`translate(${margin.left},${margin.top})`);
    let xs,ys,xlabel,ylabel,target=null;
    if(kind==="phase") { xs=record.x; ys=record.v; xlabel="x"; ylabel="xdot"; target={x:record.target[0],y:record.target[1]}; }
    else { xs=record.t; ys=record[kind]; xlabel="t"; ylabel=kind==="x"?"x":kind==="v"?"xdot":"u"; if(kind!=="u") target=record.target[kind==="x"?0:1]; }
    const allX=target&&kind==="phase"?xs.concat([target.x]):xs;
    const allY=target&&kind==="phase"?ys.concat([target.y]):target!==null&&kind!=="phase"?ys.concat([target]):ys;
    const x=d3.scaleLinear().domain(padded(allX)).range([0,innerW]);
    const y=d3.scaleLinear().domain(padded(allY)).range([innerH,0]);
    if(kind!=="phase") g.append("rect").attr("class","window").attr("x",x(1)).attr("y",0).attr("width",Math.max(0,x(10)-x(1))).attr("height",innerH);
    g.append("g").attr("class","grid").call(d3.axisLeft(y).ticks(width<340?4:5).tickSize(-innerW).tickFormat(""));
    const points=xs.map((value,i)=>({x:value,y:ys[i]}));
    g.append("path").datum(points).attr("class","actual").attr("stroke",`var(${record.color})`)
      .attr("d",d3.line().x(d=>x(d.x)).y(d=>y(d.y)));
    if(target!==null&&kind!=="phase") g.append("line").attr("class","target").attr("x1",0).attr("x2",innerW).attr("y1",y(target)).attr("y2",y(target));
    if(target&&kind==="phase") g.append("circle").attr("class","target-point").attr("cx",x(target.x)).attr("cy",y(target.y)).attr("r",4);
    g.append("rect").attr("class","frame").attr("data-chart-frame","").attr("width",innerW).attr("height",innerH);
    g.append("g").attr("class","axis").attr("transform",`translate(0,${innerH})`).call(d3.axisBottom(x).ticks(width<340?4:5));
    g.append("g").attr("class","axis").call(d3.axisLeft(y).ticks(width<340?4:5));
    svg.append("text").attr("class","axis-title").attr("data-axis","x").attr("x",margin.left+innerW/2).attr("y",height-8).attr("text-anchor","middle").text(`${xlabel} (dimensionless)`);
    svg.append("text").attr("class","axis-title").attr("data-axis","y").attr("transform",`translate(15 ${margin.top+innerH/2}) rotate(-90)`).attr("text-anchor","middle").text(`${ylabel} (dimensionless)`);
    g.append("rect").attr("data-chart-hit","").attr("data-chart-hover-overlay","cross-series").attr("width",innerW).attr("height",innerH).attr("fill","transparent")
      .on("pointermove",event => { const [px]=d3.pointer(event); const xv=x.invert(px); const i=d3.bisector(d=>d).center(xs,xv);
        tooltip.hidden=false; tooltip.textContent=kind==="phase"?`x ${xs[i].toPrecision(5)}, xdot ${ys[i].toPrecision(5)}`:`t ${xs[i].toPrecision(5)}, ${ylabel} ${ys[i].toPrecision(5)}`;
        const rect=root.getBoundingClientRect(); tooltip.style.left=`${event.clientX-rect.left+10}px`; tooltip.style.top=`${event.clientY-rect.top+10}px`; })
      .on("pointerleave",()=>{tooltip.hidden=true;});
  }
  function drawAll(){ data.cases.filter(record=>record.status==="complete").forEach(record=>["phase","x","v","u"].forEach(kind=>draw(record,kind))); }
  new ResizeObserver(drawAll).observe(comparison); drawAll();
})();
</script>
